version: '3.8'

services:
  # 1. Base de datos MariaDB
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_seguro
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  # 2. Servidor WordPress
  wordpress:
    image: wordpress:latest
    depends_on:
      - db
    ports:
      - "8080:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
    volumes:
      - wp_data:/var/www/html

  # 3. Automatizador (WP-CLI)
  wp-cli:
    image: wordpress:cli
    user: "33:33"
    depends_on:
      - wordpress
    volumes:
      - wp_data:/var/www/html
      - ./bash_scripts:/scripts
      - ./pages:/scripts/pages
      - ./data:/scripts/data
      - ./mu-plugins:/scripts/mu-plugins
    environment:
      # Credenciales de BD
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      # Variables para el init.sh
      SITE_URL: ${SITE_URL}
      SITE_TITLE: ${SITE_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_PLUGINS: ${WP_PLUGINS}
      WP_THEME: ${WP_THEME}
    command: sh /scripts/init.sh

volumes:
  db_data:
  wp_data: